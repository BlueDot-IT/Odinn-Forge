name: Feature request
description: Propose a post-v1 workflow or usability improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Odinn is under a v1 feature freeze. Major features and experimental expansions will remain tracked for post-v1 work rather than entering the v1 release scope.
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a user be able to accomplish?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current limitation
      description: What happens today, and why does it block the workflow?
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and privacy boundaries
      description: Note credentials, network access, external side effects, multi-user concerns, or sensitive data involved.
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility surface
      description: Which v1 boundary would this proposal affect?
      options:
        - Stable v1 interface
        - Internal implementation detail
        - Experimental interface
        - Provider-dependent behavior
        - Platform-dependent behavior
        - Unsupported behavior
        - Not sure
  - type: textarea
    id: evidence
    attributes:
      label: Examples or evidence
      description: Include sanitized screenshots, comparable workflows, or concrete acceptance criteria.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to verify and publish
        required: true
        type: string
      release_id:
        description: Numeric GitHub draft release ID to verify and publish
        required: true
        type: string
      staged_run_id:
        description: Original release workflow run that staged the assets (required only for resume)
        required: false
        type: string
      staged_artifact_id:
        description: Immutable odinn-release-assets artifact ID from the staging run (required only for resume)
        required: false
        type: string
      resume_staged_assets:
        description: Resume publication from assets already staged on the verified draft release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}-${{ inputs.release_id || 'event' }}
  cancel-in-progress: false

env:
  PNPM_VERSION: "10.14.0"
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_ID: ${{ inputs.release_id }}

jobs:
  verify:
    name: Verify release candidate
    needs: release-policy
    if: ${{ !inputs.resume_staged_assets }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-policy.outputs.release_commit }}
          persist-credentials: false
      - name: Record checked-out release commit
        shell: bash
        run: echo "ODINN_RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.release-policy.outputs.node_version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:preflight
        env:
          ODINN_RELEASE_TAG: ${{ env.RELEASE_TAG }}
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm test:invariants
      - run: pnpm smoke:inference
      - run: node scripts/ci/audit.ts high

  release-policy:
    name: Validate draft release and tag
    runs-on: ubuntu-latest
    outputs:
      release_commit: ${{ steps.release.outputs.commit }}
      node_version: ${{ steps.runtime.outputs.node_version }}
      attestation_run_id: ${{ steps.release.outputs.attestation_run_id }}
      release_assets_artifact_id: ${{ steps.release.outputs.release_assets_artifact_id }}
    permissions:
      actions: read
      # Draft releases are hidden from tokens without push-level contents
      # access, even for a read-only GET by numeric release ID.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Load exact reviewed Node runtime policy
        id: runtime
        shell: bash
        run: |
          node_version="$(jq -er '.version | select(test("^24\\.[0-9]+\\.[0-9]+$"))' release/node-runtime-policy.json)"
          echo "node_version=$node_version" >> "$GITHUB_OUTPUT"
      - name: Validate existing draft release and tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
          RESUME_STAGED_ASSETS: ${{ inputs.resume_staged_assets }}
          STAGED_RUN_ID: ${{ inputs.staged_run_id }}
          STAGED_ARTIFACT_ID: ${{ inputs.staged_artifact_id }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          test -n "$TAG"
          test -n "$RELEASE_ID"
          tag_commit="$(git rev-list -n 1 "refs/tags/$TAG")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          expected_prerelease=false
          [[ "$TAG" == *-* ]] && expected_prerelease=true
          jq -e --arg releaseId "$RELEASE_ID" --arg tag "$TAG" \
            --argjson expectedPrerelease "$expected_prerelease" \
            '(.id | tostring) == $releaseId and .tag_name == $tag and .draft == true and .prerelease == $expectedPrerelease' \
            <<<"$release"
          if [[ "$RESUME_STAGED_ASSETS" == "true" ]]; then
            [[ "$STAGED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$STAGED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            attestation_run_id="$STAGED_RUN_ID"
            release_assets_artifact_id="$STAGED_ARTIFACT_ID"
          else
            test -z "$STAGED_RUN_ID"
            test -z "$STAGED_ARTIFACT_ID"
            attestation_run_id="$GITHUB_RUN_ID"
            release_assets_artifact_id=""
          fi
          staged_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${attestation_run_id}")"
          jq -e --argjson runId "$attestation_run_id" --arg commit "$tag_commit" --arg repository "$GITHUB_REPOSITORY" \
            '.id == $runId and .head_sha == $commit and .head_branch == "main" and .event == "workflow_dispatch" and
             .path == ".github/workflows/release.yml" and .repository.full_name == $repository' <<<"$staged_run"
          if [[ "$RESUME_STAGED_ASSETS" == "true" ]]; then
            staged_artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${release_assets_artifact_id}")"
            jq -e --argjson artifactId "$release_assets_artifact_id" --argjson runId "$attestation_run_id" --arg commit "$tag_commit" \
              '.id == $artifactId and .name == "odinn-release-assets" and .expired == false and
               .workflow_run.id == $runId and .workflow_run.head_sha == $commit and .workflow_run.head_branch == "main"' \
              <<<"$staged_artifact"
          fi
          {
            echo "commit=$tag_commit"
            echo "attestation_run_id=$attestation_run_id"
            echo "release_assets_artifact_id=$release_assets_artifact_id"
          } >> "$GITHUB_OUTPUT"

  native-launchers:
    name: Build native launcher (${{ matrix.target }})
    needs:
      - release-policy
      - verify
    if: ${{ !inputs.resume_staged_assets }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15-large
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-policy.outputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.release-policy.outputs.node_version }}
      - name: Build and reproduce the host-native loader boundary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/native-launchers
          node scripts/release/native-launcher.ts "$TARGET" "dist/native-launchers/odinn-launcher-$TARGET.first"
          node scripts/release/native-launcher.ts "$TARGET" "dist/native-launchers/odinn-launcher-$TARGET.second"
          cmp "dist/native-launchers/odinn-launcher-$TARGET.first" "dist/native-launchers/odinn-launcher-$TARGET.second"
          mv "dist/native-launchers/odinn-launcher-$TARGET.first" "dist/native-launchers/odinn-launcher-$TARGET"
          rm "dist/native-launchers/odinn-launcher-$TARGET.second"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: odinn-native-launcher-${{ matrix.target }}
          path: dist/native-launchers/odinn-launcher-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  source-package:
    name: Build release assets
    needs:
      - release-policy
      - verify
      - native-launchers
    if: ${{ !inputs.resume_staged_assets }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      release_assets_artifact_id: ${{ steps.release-assets.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-policy.outputs.release_commit }}
          persist-credentials: false
      - name: Record checked-out release commit
        shell: bash
        run: echo "ODINN_RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.release-policy.outputs.node_version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm release:package
        env:
          GITHUB_SHA: ${{ env.ODINN_RELEASE_COMMIT }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: odinn-native-launcher-*
          path: dist/native-launchers
          merge-multiple: true
      - run: pnpm release:package-standalone
      - run: pnpm release:soak
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist/package-stage
          format: spdx-json
          output-file: dist/release/odinn-anchore.spdx.json
      - run: pnpm release:checksums
      - run: node scripts/release/verify.ts
      - run: pnpm release:install-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: odinn-npm-package
          path: dist/package-stage/odinn-v*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: release-assets
        with:
          name: odinn-release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

  stage-release-assets:
    name: Stage release assets and verify publication integrity
    needs:
      - release-policy
      - source-package
    if: ${{ !inputs.resume_staged_assets }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      release_assets_artifact_id: ${{ needs.source-package.outputs.release_assets_artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-policy.outputs.release_commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.release-policy.outputs.node_version }}
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install secure release-validation dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: odinn-npm-package
          path: dist/npm-package
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.source-package.outputs.release_assets_artifact_id }}
          path: release-assets
      - name: Record immutable release artifact identity
        shell: bash
        env:
          RELEASE_ASSETS_ARTIFACT_ID: ${{ needs.source-package.outputs.release_assets_artifact_id }}
        run: |
          [[ "$RELEASE_ASSETS_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          {
            echo "### Staged release recovery identity"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo "- Actions artifact: \`$RELEASE_ASSETS_ARTIFACT_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Revalidate draft release and exact tag commit
        id: tag
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.release-policy.outputs.release_commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          test "$(git rev-list -n 1 "refs/tags/$TAG")" = "$EXPECTED_COMMIT"
          test -n "$RELEASE_ID"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          expected_prerelease=false
          [[ "$TAG" == *-* ]] && expected_prerelease=true
          jq -e --arg releaseId "$RELEASE_ID" --arg tag "$TAG" --argjson expectedPrerelease "$expected_prerelease" \
            '(.id | tostring) == $releaseId and .tag_name == $tag and .draft == true and .prerelease == $expectedPrerelease' <<<"$release"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-assets/*
      - name: Upload and verify release assets
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.release-policy.outputs.release_commit }}
          ATTESTATION_RUN_ID: ${{ needs.release-policy.outputs.attestation_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ODINN_RELEASE_COMMIT: ${{ needs.release-policy.outputs.release_commit }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          test "$(git rev-list -n 1 "refs/tags/$TAG")" = "$EXPECTED_COMMIT"
          expected_assets="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          existing_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          if [[ -z "$existing_assets" ]]; then
            gh release upload "$TAG" release-assets/*
          else
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$existing_assets")
          fi
          mkdir -p downloaded-release-assets
          gh release download "$TAG" --dir downloaded-release-assets
          node scripts/release/verify-attested-assets.ts release-assets downloaded-release-assets \
            "$GITHUB_REPOSITORY" "$EXPECTED_COMMIT" "$ATTESTATION_RUN_ID"
          node scripts/release/verify-downloaded-assets.ts downloaded-release-assets
          node scripts/release/install-smoke.ts downloaded-release-assets
          node scripts/release/validate-prior-rollback.ts --candidate-release downloaded-release-assets

  validate-downloaded-release:
    name: Validate downloaded release (${{ matrix.os }})
    needs:
      - release-policy
      - stage-release-assets
    if: ${{ always() && needs.release-policy.result == 'success' && (inputs.resume_staged_assets || needs.stage-release-assets.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15-large
            target: darwin-x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-policy.outputs.release_commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.release-policy.outputs.node_version }}
          cache: pnpm
      - name: Install secure release-validation dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download immutable Actions release asset inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.resume_staged_assets && needs.release-policy.outputs.release_assets_artifact_id || needs.stage-release-assets.outputs.release_assets_artifact_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-policy.outputs.attestation_run_id }}
          path: expected-release-assets
      - name: Download exact draft-release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          mkdir -p downloaded-release-assets
          gh release download "$TAG" --dir downloaded-release-assets
      - name: Authenticate exact draft inventory and bytes
        shell: bash
        env:
          ATTESTATION_RUN_ID: ${{ needs.release-policy.outputs.attestation_run_id }}
          EXPECTED_COMMIT: ${{ needs.release-policy.outputs.release_commit }}
        run: |
          node scripts/release/verify-attested-assets.ts expected-release-assets downloaded-release-assets \
            "$GITHUB_REPOSITORY" "$EXPECTED_COMMIT" "$ATTESTATION_RUN_ID"
      - name: Verify downloaded checksums, metadata, SBOM, and provenance
        shell: bash
        env:
          ODINN_RELEASE_COMMIT: ${{ needs.release-policy.outputs.release_commit }}
        run: node scripts/release/verify-downloaded-assets.ts downloaded-release-assets
      - name: Run install and recovery smoke against downloaded archives
        run: node scripts/release/install-smoke.ts downloaded-release-assets
      - name: Run controlled-runtime standalone smoke without ambient Node use
        run: node scripts/release/standalone-smoke.ts downloaded-release-assets ${{ matrix.target }}
      - name: Run prior baseline rollback validation against downloaded candidate
        run: node scripts/release/validate-prior-rollback.ts --candidate-release downloaded-release-assets

  publish-release:
    name: Publish npm package and verified release
    needs:
      - release-policy
      - source-package
      - stage-release-assets
      - validate-downloaded-release
    if: ${{ always() && needs.release-policy.result == 'success' && needs.validate-downloaded-release.result == 'success' && (inputs.resume_staged_assets || (needs.source-package.result == 'success' && needs.stage-release-assets.result == 'success')) }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      attestations: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-policy.outputs.release_commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: ${{ inputs.resume_staged_assets }}
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.release-policy.outputs.node_version }}
          registry-url: https://registry.npmjs.org
      - name: Install secure extraction dependencies for staged recovery
        if: ${{ inputs.resume_staged_assets }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: ${{ !inputs.resume_staged_assets }}
        with:
          name: odinn-npm-package
          path: dist/npm-package
      - name: Download immutable Actions release assets for staged recovery
        if: ${{ inputs.resume_staged_assets }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.release-policy.outputs.release_assets_artifact_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-policy.outputs.attestation_run_id }}
          path: dist/resume-actions-assets
      - name: Recover npm package from verified staged release archive
        if: ${{ inputs.resume_staged_assets }}
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.release-policy.outputs.release_commit }}
          ATTESTATION_RUN_ID: ${{ needs.release-policy.outputs.attestation_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$version"
          mkdir -p dist/resume-assets dist/npm-package
          gh release download "$TAG" --dir dist/resume-assets
          node scripts/release/verify-attested-assets.ts dist/resume-actions-assets dist/resume-assets \
            "$GITHUB_REPOSITORY" "$EXPECTED_COMMIT" "$ATTESTATION_RUN_ID"
          ODINN_RELEASE_COMMIT="$EXPECTED_COMMIT" node scripts/release/verify-downloaded-assets.ts dist/resume-assets
          node scripts/release/extract-secure-archive.ts "dist/resume-assets/odinn-v$version.tar.gz" dist/npm-package "odinn-v$version"
          package_manifest="dist/npm-package/odinn-v$version/package.json"
          release_info="dist/npm-package/odinn-v$version/release-info.json"
          PACKAGE_MANIFEST="$package_manifest" RELEASE_INFO="$release_info" EXPECTED_VERSION="$version" \
            EXPECTED_COMMIT="$EXPECTED_COMMIT" node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const manifestPath = process.env.PACKAGE_MANIFEST;
          const releaseInfoPath = process.env.RELEASE_INFO;
          const expectedVersion = process.env.EXPECTED_VERSION;
          const expectedCommit = process.env.EXPECTED_COMMIT;
          const manifest = JSON.parse(await readFile(manifestPath, "utf8"));
          const releaseInfo = JSON.parse(await readFile(releaseInfoPath, "utf8"));
          if (manifest.name !== "odinn" || manifest.version !== expectedVersion || manifest.private !== false) {
            throw new Error("staged archive package metadata is not the expected public Odinn package");
          }
          if (releaseInfo.version !== expectedVersion || releaseInfo.commit !== expectedCommit ||
              releaseInfo.distributionName !== "@bluedot-it/odinn") {
            throw new Error("staged archive release identity does not authorize the npm distribution transform");
          }
          await writeFile(manifestPath, `${JSON.stringify({ ...manifest, name: "@bluedot-it/odinn" }, null, 2)}\n`);
          NODE
      - name: Revalidate draft release and exact tag commit
        id: tag
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.release-policy.outputs.release_commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          test "$(git rev-list -n 1 "refs/tags/$TAG")" = "$EXPECTED_COMMIT"
          test -n "$RELEASE_ID"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          expected_prerelease=false
          [[ "$TAG" == *-* ]] && expected_prerelease=true
          jq -e --arg releaseId "$RELEASE_ID" --arg tag "$TAG" --argjson expectedPrerelease "$expected_prerelease" \
            '(.id | tostring) == $releaseId and .tag_name == $tag and .draft == true and .prerelease == $expectedPrerelease' <<<"$release"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish npm package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          package="@bluedot-it/odinn@$version"
          mapfile -t package_manifests < <(find dist/npm-package -type f -name package.json -not -path '*/node_modules/*' -print)
          test "${#package_manifests[@]}" -eq 1
          package_dir="${package_manifests[0]%/*}"
          test "$package_dir" != "${package_manifests[0]}"
          test "$(node -p "require('./${package_manifests[0]}').name")" = "@bluedot-it/odinn"
          test "$(node -p "require('./${package_manifests[0]}').version")" = "$version"
          if npm view "$package" version >/dev/null 2>&1; then
            echo "$package is already published; proving the registry tarball matches the candidate"
            registry_tarball="$(npm view "$package" dist.tarball)"
            test -n "$registry_tarball"
            compare_dir="$(mktemp -d)"
            trap 'rm -rf "$compare_dir"' EXIT
            npm pack "$package_dir" --pack-destination "$compare_dir" >/dev/null
            mapfile -t candidate_tarballs < <(find "$compare_dir" -maxdepth 1 -type f -name '*.tgz' -print)
            test "${#candidate_tarballs[@]}" -eq 1
            curl --fail --location --silent --show-error "$registry_tarball" --output "$compare_dir/registry.tgz"
            cmp "${candidate_tarballs[0]}" "$compare_dir/registry.tgz"
          else
            if [[ "$version" == *-* ]]; then
              npm publish "$package_dir" --tag next --access public --provenance
            else
              npm publish "$package_dir" --access public --provenance
            fi
          fi
      - name: Redownload immutable Actions release assets for promotion
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.resume_staged_assets && needs.release-policy.outputs.release_assets_artifact_id || needs.stage-release-assets.outputs.release_assets_artifact_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-policy.outputs.attestation_run_id }}
          path: dist/promotion-actions-assets
      - name: Promote verified GitHub release (npm publication is already durable)
        shell: bash
        env:
          ATTESTATION_RUN_ID: ${{ needs.release-policy.outputs.attestation_run_id }}
          EXPECTED_COMMIT: ${{ needs.release-policy.outputs.release_commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          test -n "$RELEASE_ID"
          mkdir -p dist/promotion-draft-assets
          gh release download "$TAG" --dir dist/promotion-draft-assets
          node scripts/release/verify-attested-assets.ts dist/promotion-actions-assets dist/promotion-draft-assets \
            "$GITHUB_REPOSITORY" "$EXPECTED_COMMIT" "$ATTESTATION_RUN_ID"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          jq -e --arg releaseId "$RELEASE_ID" --arg tag "$TAG" \
            '(.id | tostring) == $releaseId and .tag_name == $tag and .draft == true' <<<"$release"
          if ! gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false >/dev/null; then
            echo "::error::npm publication completed or was already present, but GitHub release $TAG remains a draft; rerun this workflow with the same tag after resolving the GitHub release failure."
            exit 1
          fi
          expected_prerelease=false
          [[ "$TAG" == *-* ]] && expected_prerelease=true
          published="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          jq -e --arg releaseId "$RELEASE_ID" --arg tag "$TAG" --argjson expectedPrerelease "$expected_prerelease" \
            '(.id | tostring) == $releaseId and .tag_name == $tag and .draft == false and
             .prerelease == $expectedPrerelease and .immutable == true' <<<"$published"
          published_by_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          jq -e --arg releaseId "$RELEASE_ID" --arg tag "$TAG" --argjson expectedPrerelease "$expected_prerelease" \
            '(.id | tostring) == $releaseId and .tag_name == $tag and .draft == false and
             .prerelease == $expectedPrerelease and .immutable == true' <<<"$published_by_tag"

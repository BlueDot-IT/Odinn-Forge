name: Weekly comparative benchmarks

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: odinn-maintainer-oauth-${{ github.repository }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.15.0"
  PNPM_VERSION: "10.14.0"
  BENCHMARK_COMMIT: 8ad91f0b9e396c88cf10e56687630539ce10bcd1
  ODINN_VERSION: "1.1.1"
  OPENCLAW_VERSION: "2026.7.1-2"
  HERMES_VERSION: "0.19.0"

jobs:
  benchmark:
    name: Run three-runtime matrix
    runs-on: ubuntu-latest
    timeout-minutes: 210
    permissions:
      contents: read
    steps:
      - name: Check out Odinn Forge without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check out the pinned external harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: BlueDot-IT/agent-benchmarks
          ref: ${{ env.BENCHMARK_COMMIT }}
          path: harness-base
          persist-credentials: false
          fetch-depth: 1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned harness and runtimes
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir harness-base install --frozen-lockfile --ignore-scripts
          npm install --global "openclaw@${OPENCLAW_VERSION}"
          python -m pip install --disable-pip-version-check "hermes-agent==${HERMES_VERSION}"
          curl --fail --silent --show-error --location \
            "https://github.com/BlueDot-IT/Odinn-Forge/releases/download/v${ODINN_VERSION}/odinn-v${ODINN_VERSION}.tar.gz" \
            --output "${RUNNER_TEMP}/odinn.tar.gz"
          echo "686bb66f2cd01c1467a120957032084932535cd753fd2267628e19a20e9faf55  ${RUNNER_TEMP}/odinn.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/odinn.tar.gz" --directory "${RUNNER_TEMP}"
          cp -a harness-base "${RUNNER_TEMP}/harness-odinn"
          cp -a harness-base "${RUNNER_TEMP}/harness-openclaw"
          cp -a harness-base "${RUNNER_TEMP}/harness-hermes"

      - name: Prepare isolated runtime state from the synchronized repository secret
        shell: bash
        env:
          ODINN_OPENAI_OAUTH_JSON: ${{ secrets.ODINN_OPENAI_OAUTH_JSON }}
        run: |
          set -euo pipefail
          node scripts/ci/weekly-benchmark-state.ts prepare \
            --state-root "${RUNNER_TEMP}/benchmark-state" \
            --harness "${GITHUB_WORKSPACE}/harness-base" \
            --odinn "${RUNNER_TEMP}/odinn-v${ODINN_VERSION}/bin/odinn" \
            --openclaw "$(command -v openclaw)" \
            --hermes "$(command -v hermes)" \
            --config-output "${RUNNER_TEMP}/adapters.json"

      - name: Run the complete matrix in parallel
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          run_adapter() {
            local adapter="$1"
            local harness="$2"
            pnpm --dir "${harness}" benchmark -- \
              --config "${RUNNER_TEMP}/adapters.json" \
              --suite benchmarks/suites/comprehensive.json \
              --adapter "${adapter}" \
              --trials 5 \
              --strict-comparison \
              --output "${harness}/dist/benchmarks/${adapter}" \
              --lock-file "${RUNNER_TEMP}/${adapter}.lock" \
              > "${RUNNER_TEMP}/${adapter}.log" 2>&1
          }
          run_adapter odinn-forge "${RUNNER_TEMP}/harness-odinn" & odinn_pid=$!
          run_adapter openclaw "${RUNNER_TEMP}/harness-openclaw" & openclaw_pid=$!
          run_adapter hermes-agent "${RUNNER_TEMP}/harness-hermes" & hermes_pid=$!
          status=0
          wait "${odinn_pid}" || status=1
          wait "${openclaw_pid}" || status=1
          wait "${hermes_pid}" || status=1
          for adapter in odinn-forge openclaw hermes-agent; do
            echo "## ${adapter}" >> "${GITHUB_STEP_SUMMARY}"
            tail -n 25 "${RUNNER_TEMP}/${adapter}.log" >> "${GITHUB_STEP_SUMMARY}" || true
          done
          exit "${status}"

      - name: Collect complete reports
        if: steps.matrix.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/weekly-benchmark-reports"
          for adapter in odinn-forge openclaw hermes-agent; do
            harness="${RUNNER_TEMP}/harness-${adapter%%-*}"
            if [[ "${adapter}" == "hermes-agent" ]]; then harness="${RUNNER_TEMP}/harness-hermes"; fi
            mapfile -t reports < <(find "${harness}/dist/benchmarks/${adapter}" -maxdepth 1 -type f -name '*.json' ! -name '*.progress.json' -print | sort)
            if [[ "${#reports[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one final JSON report for ${adapter}, found ${#reports[@]}."
              exit 1
            fi
            cp "${reports[0]}" "${RUNNER_TEMP}/weekly-benchmark-reports/${adapter}.json"
          done

      - name: Remove plaintext credentials and runtime state
        if: always()
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/benchmark-state" "${RUNNER_TEMP}/adapters.json"

      - name: Upload complete reports for documentation
        if: steps.matrix.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-benchmark-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/weekly-benchmark-reports/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

      - name: Upload raw benchmark evidence
        if: steps.matrix.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-benchmark-raw-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/harness-odinn/dist/benchmarks/
            ${{ runner.temp }}/harness-openclaw/dist/benchmarks/
            ${{ runner.temp }}/harness-hermes/dist/benchmarks/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-benchmark-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/harness-odinn/dist/benchmarks/**/*.progress.ndjson
            ${{ runner.temp }}/harness-openclaw/dist/benchmarks/**/*.progress.ndjson
            ${{ runner.temp }}/harness-hermes/dist/benchmarks/**/*.progress.ndjson
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 14

  publish:
    name: Publish current Odinn Forge benchmark docs
    needs: benchmark
    if: needs.benchmark.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      PUBLISH_BRANCH: automation/weekly-benchmark-docs
    steps:
      - name: Check out the benchmarked main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download complete reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly-benchmark-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/weekly-benchmark-reports

      - name: Generate current benchmark documentation
        shell: bash
        run: |
          node scripts/ci/weekly-benchmark-docs.ts \
            --reports "${RUNNER_TEMP}/weekly-benchmark-reports" \
            --readme README.md \
            --docs docs/benchmarks.md \
            --run-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --expected-commit "${BENCHMARK_COMMIT}"
          git diff --check

      - name: Publish updated benchmark snapshot branch with an exact lease
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git add README.md docs/benchmarks.md
          if git diff --cached --quiet; then
            echo "Benchmark documentation is already current." >> "${GITHUB_STEP_SUMMARY}"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(bench): update weekly comparison"
          remote_ref="refs/heads/${PUBLISH_BRANCH}"
          remote_sha="$(git ls-remote --heads origin "${remote_ref}" | awk '{print $1}')"
          if [[ -n "${remote_sha}" ]]; then
            git push origin "HEAD:${remote_ref}" --force-with-lease="${remote_ref}:${remote_sha}"
          else
            git push origin "HEAD:${remote_ref}" --force-with-lease="${remote_ref}:"
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Reuse or create the protected documentation pull request
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing_url="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${PUBLISH_BRANCH}" \
            --state open \
            --json url \
            --jq '.[0].url // empty')"
          if [[ -n "${existing_url}" ]]; then
            echo "Updated protected benchmark documentation PR: ${existing_url}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          body_file="${RUNNER_TEMP}/weekly-benchmark-pr.md"
          cat > "${body_file}" <<EOF
          ## Problem

          Publish the complete, pinned three-runtime benchmark evidence from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} without writing directly to protected \`main\`.

          ## Implementation

          Update only the generated benchmark snapshot in \`README.md\` and \`docs/benchmarks.md\`.

          ## Compatibility impact

          Documentation-only; no runtime interface changes.

          ## State migration impact

          None.

          ## Security impact

          The source reports are bound to the pinned harness commit and validated before publication. This PR remains subject to normal branch protection.

          ## Documentation impact

          - [x] Documentation updated
          - [ ] Documentation not required

          Documentation details: generated \`README.md\` and \`docs/benchmarks.md\` benchmark evidence.

          ## Validation

          - [x] Complete three-runtime report matrix validated
          - [x] Exact harness commit and clean source tree verified
          - [x] Strict comparison and complete trial accounting verified
          - [x] \`git diff --check\`

          ## Rollback

          Revert the generated documentation commit; no persistent state changes are involved.
          EOF

          if created_url="$(gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${PUBLISH_BRANCH}" \
            --title "docs(bench): update weekly comparison" \
            --body-file "${body_file}" 2>"${RUNNER_TEMP}/weekly-benchmark-pr-error.log")"; then
            echo "Created protected benchmark documentation PR: ${created_url}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::The benchmark branch was published, but repository policy did not permit this workflow token to create a pull request. A maintainer must open ${PUBLISH_BRANCH} against main."
            echo "Benchmark branch published. Human gate: open \`${PUBLISH_BRANCH}\` against \`main\`; repository policy prevented workflow-created PRs." >> "${GITHUB_STEP_SUMMARY}"
          fi

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base commit for an explicitly dispatched dependency review
        required: false
        type: string
      head_sha:
        description: Head commit for an explicitly dispatched dependency review
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/codeql-results
          upload: ${{ github.event_name != 'pull_request' }}
      - name: Retain CodeQL results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-results-${{ github.sha }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' || (inputs.base_sha != '' && inputs.head_sha != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      NODE_VERSION: "24.19.0"
      PNPM_VERSION: "10.14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check dependency review API availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: |
          status="$(curl --silent --show-error --output dependency-review-response.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}")"
          echo "HTTP status: ${status}"
          if [ "${status}" = "200" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            cat dependency-review-response.json
          fi

      - name: Review changed dependencies
        if: steps.dependency-graph.outputs.available == 'true'
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

      - name: Set up pnpm fallback
        if: steps.dependency-graph.outputs.available != 'true' || steps.dependency-review.outcome == 'failure'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js fallback
        if: steps.dependency-graph.outputs.available != 'true' || steps.dependency-review.outcome == 'failure'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Audit lockfile fallback
        if: steps.dependency-graph.outputs.available != 'true' || steps.dependency-review.outcome == 'failure'
        run: |
          pnpm install --frozen-lockfile
          node scripts/ci/audit.ts high

  audit:
    name: Dependency and lockfile audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_VERSION: "24.19.0"
      PNPM_VERSION: "10.14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci/audit.ts high
      - run: pnpm lint

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            detect --source . --redact --no-banner --verbose

  scorecard:
    name: OpenSSF Scorecard
    needs: codeql
    # Scorecard only supports the repository default branch. Explicit release-PR
    # dispatches still run every merge-blocking security job against the supplied
    # commit, while Scorecard continues to run on main pushes and schedules.
    # OpenSSF Scorecard's GitHub integration cannot query commit history for a
    # private repository with GITHUB_TOKEN. The mandatory private-repo scans
    # above still run; Scorecard activates automatically if the repo is public.
    if: ${{ !cancelled() && github.event.repository.private == false && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Retain Scorecard results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results-${{ github.sha }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 14

name: Merge Queue

on:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-queue-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.14.0"

jobs:
  validate:
    name: Merge queue validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:preflight
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm smoke:inference
      - run: pnpm benchmark:ci
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-report-${{ github.run_id }}
          path: |
            dist/benchmark/benchmark.json
            dist/benchmark/workspace-inspection.json
          if-no-files-found: warn
          retention-days: 14
      - run: pnpm build
      - run: pnpm release:package
      - run: pnpm release:checksums
      - run: node scripts/release/verify.ts
      - run: pnpm release:install-smoke

name: Package Integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-integrity-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.22.1"
  PNPM_VERSION: "10.14.0"
  ODINN_RELEASE_VALIDATION_ONLY: "1"

jobs:
  verify-package:
    name: Verify package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:preflight
      - run: pnpm build
      - run: pnpm release:package
      - run: pnpm release:checksums
      - run: node scripts/release/verify.ts
      - run: pnpm release:install-smoke
      - run: pnpm release:rollback-smoke

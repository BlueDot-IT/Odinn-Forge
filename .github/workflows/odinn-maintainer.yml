name: Odinn Maintainer

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: Item type for a manual review
        required: true
        default: pull_request
        type: choice
        options: [pull_request, issue]
      number:
        description: Issue or pull request number
        required: false
        type: number

permissions: {}

concurrency:
  group: odinn-maintainer-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.number || github.run_id }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover reconciliation targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - id: targets
        uses: BlueDot-IT/odinn-maintainer/.github/actions/targets@e2e078dc86b124e2e0b912cf32c0de0945155d57 # v0.5.0
        with:
          github-read-token: ${{ github.token }}
          include-issues: "true"

  plan:
    name: "Plan ${{ matrix.target.kind }} #${{ matrix.target.number }}"
    needs: discover
    if: needs.discover.outputs.count != '0' && vars.ODINN_MAINTAINER_ENABLED == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
    steps:
      - id: maintainer
        uses: BlueDot-IT/odinn-maintainer/.github/actions/plan@e2e078dc86b124e2e0b912cf32c0de0945155d57 # v0.5.0
        with:
          github-read-token: ${{ github.token }}
          oauth-json: ${{ secrets.ODINN_OPENAI_OAUTH_JSON }}
          model: ${{ vars.ODINN_MAINTAINER_MODEL || 'gpt-5.5' }}
          kind: ${{ matrix.target.kind }}
          number: ${{ matrix.target.number }}
          oauth-client-id: ${{ vars.ODINN_OPENAI_OAUTH_CLIENT_ID || 'app_EMoamEEZ73f0CkXaXp7hrann' }}
          originator: ${{ vars.ODINN_OPENAI_ORIGINATOR || 'odinn-maintainer' }}
          client-version: ${{ vars.ODINN_OPENAI_CLIENT_VERSION || '4.0.3' }}
          allow-automation: ${{ vars.ODINN_MAINTAINER_AUTOMATION_ENABLED || 'false' }}
          allow-repair: ${{ vars.ODINN_MAINTAINER_ALLOW_REPAIR || 'false' }}
      - name: Upload bounded plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: odinn-maintainer-plan-${{ github.run_id }}-${{ matrix.target.kind }}-${{ matrix.target.number }}
          path: ${{ steps.maintainer.outputs.plan-path }}
          if-no-files-found: error
          retention-days: 1

  apply:
    name: "Apply ${{ matrix.target.kind }} #${{ matrix.target.number }}"
    needs: [discover, plan]
    if: always() && needs.discover.outputs.count != '0' && vars.ODINN_MAINTAINER_ENABLED == 'true' && needs.plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      checks: write
      issues: write
      pull-requests: write
    steps:
      - id: download
        name: Download bounded plan
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: odinn-maintainer-plan-${{ github.run_id }}-${{ matrix.target.kind }}-${{ matrix.target.number }}
          path: ${{ runner.temp }}/odinn-maintainer-plan
      - id: maintainer
        if: steps.download.outcome == 'success'
        uses: BlueDot-IT/odinn-maintainer/.github/actions/apply@e2e078dc86b124e2e0b912cf32c0de0945155d57 # v0.5.0
        with:
          github-token: ${{ github.token }}
          plan-path: ${{ runner.temp }}/odinn-maintainer-plan/plan.json
          allow-automation: ${{ vars.ODINN_MAINTAINER_AUTOMATION_ENABLED || 'false' }}
          allow-labels: ${{ vars.ODINN_MAINTAINER_ALLOW_LABELS || 'false' }}
          allow-close: ${{ vars.ODINN_MAINTAINER_ALLOW_CLOSE || 'false' }}
          allow-merge: ${{ vars.ODINN_MAINTAINER_ALLOW_MERGE || 'false' }}
          allow-repair: ${{ vars.ODINN_MAINTAINER_ALLOW_REPAIR || 'false' }}
      - name: Publish reconciliation dashboard
        if: always()
        shell: bash
        env:
          TARGET_KIND: ${{ matrix.target.kind }}
          TARGET_NUMBER: ${{ matrix.target.number }}
          DECISION: ${{ steps.maintainer.outputs.decision }}
          CONFIDENCE: ${{ steps.maintainer.outputs.confidence }}
          ACTION: ${{ steps.maintainer.outputs.action }}
          STALE: ${{ steps.maintainer.outputs.stale }}
        run: |
          {
            echo "## Odinn Maintainer reconciliation"
            echo
            echo "- Target: ${TARGET_KIND} #${TARGET_NUMBER}"
            echo "- Decision: ${DECISION:-unavailable}"
            echo "- Confidence: ${CONFIDENCE:-unavailable}"
            echo "- Guarded action: ${ACTION:-none}"
            echo "- Stale plan blocked: ${STALE:-false}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report an unrecoverable queue item
        if: steps.download.outcome != 'success'
        shell: bash
        run: |
          echo "::error::No valid plan artifact was produced for this target; a later event or scheduled sweep will retry it."
          exit 1

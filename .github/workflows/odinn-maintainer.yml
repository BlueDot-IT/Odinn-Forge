name: Odinn Maintainer

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited, labeled, unlabeled]
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: Item type for a manual review
        required: true
        default: pull_request
        type: choice
        options: [pull_request, issue]
      number:
        description: Issue or pull request number
        required: false
        type: number

permissions: {}

jobs:
  discover:
    name: Discover reconciliation targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - id: targets
        uses: BlueDot-IT/odinn-maintainer/.github/actions/targets@f9b37ebf6e225572790b454f37af13e0ea767568 # v0.5.0
        with:
          github-read-token: ${{ github.token }}
          include-issues: "true"

  reconcile:
    name: "Reconcile ${{ matrix.target.kind }} #${{ matrix.target.number }}"
    needs: discover
    if: needs.discover.outputs.count != '0' && vars.ODINN_MAINTAINER_ENABLED == 'true'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    permissions:
      actions: read
      contents: write
      checks: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/odinn-maintainer-target.yml
    with:
      target_kind: ${{ matrix.target.kind }}
      target_number: ${{ matrix.target.number }}
      model: ${{ vars.ODINN_MAINTAINER_MODEL || 'gpt-5.5' }}
      oauth_client_id: ${{ vars.ODINN_OPENAI_OAUTH_CLIENT_ID || 'app_EMoamEEZ73f0CkXaXp7hrann' }}
      originator: ${{ vars.ODINN_OPENAI_ORIGINATOR || 'odinn-maintainer' }}
      client_version: ${{ vars.ODINN_OPENAI_CLIENT_VERSION || '4.0.3' }}
      allow_automation: ${{ vars.ODINN_MAINTAINER_AUTOMATION_ENABLED || 'false' }}
      allow_labels: ${{ vars.ODINN_MAINTAINER_ALLOW_LABELS || 'false' }}
      allow_close: ${{ vars.ODINN_MAINTAINER_ALLOW_CLOSE || 'false' }}
      allow_merge: ${{ vars.ODINN_MAINTAINER_ALLOW_MERGE || 'false' }}
      allow_repair: ${{ vars.ODINN_MAINTAINER_ALLOW_REPAIR || 'false' }}
    secrets:
      oauth_json: ${{ secrets.ODINN_OPENAI_OAUTH_JSON }}

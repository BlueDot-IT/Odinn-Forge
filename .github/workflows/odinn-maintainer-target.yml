name: Odinn Maintainer Target

on:
  workflow_call:
    inputs:
      target_kind:
        description: Reconciliation target kind.
        required: true
        type: string
      target_number:
        description: Reconciliation target issue or pull request number.
        required: true
        type: number
      model:
        description: ChatGPT Codex model used for planning.
        required: true
        type: string
      oauth_client_id:
        description: OAuth client identifier used for token refresh.
        required: true
        type: string
      originator:
        description: Codex transport originator.
        required: true
        type: string
      client_version:
        description: Codex transport client version.
        required: true
        type: string
      allow_automation:
        description: Global automation kill switch.
        required: true
        type: string
      allow_labels:
        description: Permit deterministic label reconciliation.
        required: true
        type: string
      allow_close:
        description: Permit guarded close operations.
        required: true
        type: string
      allow_merge:
        description: Permit guarded merge operations.
        required: true
        type: string
      allow_repair:
        description: Permit bounded repair operations.
        required: true
        type: string
    secrets:
      oauth_json:
        description: Odinn OAuth token record JSON used only by planning.
        required: true

permissions: {}

concurrency:
  group: odinn-maintainer-${{ github.repository }}-${{ inputs.target_kind }}-${{ inputs.target_number }}
  cancel-in-progress: false

jobs:
  plan:
    name: "Plan ${{ inputs.target_kind }} #${{ inputs.target_number }}"
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
    steps:
      - id: maintainer
        uses: BlueDot-IT/odinn-maintainer/.github/actions/plan@e2e078dc86b124e2e0b912cf32c0de0945155d57 # v0.5.0
        with:
          github-read-token: ${{ github.token }}
          oauth-json: ${{ secrets.oauth_json }}
          model: ${{ inputs.model }}
          kind: ${{ inputs.target_kind }}
          number: ${{ inputs.target_number }}
          oauth-client-id: ${{ inputs.oauth_client_id }}
          originator: ${{ inputs.originator }}
          client-version: ${{ inputs.client_version }}
          allow-automation: ${{ inputs.allow_automation }}
          allow-repair: ${{ inputs.allow_repair }}
      - name: Upload bounded plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: odinn-maintainer-plan-${{ github.run_id }}-${{ inputs.target_kind }}-${{ inputs.target_number }}
          path: ${{ steps.maintainer.outputs.plan-path }}
          if-no-files-found: error
          retention-days: 1

  apply:
    name: "Apply ${{ inputs.target_kind }} #${{ inputs.target_number }}"
    needs: plan
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      checks: write
      issues: write
      pull-requests: write
    steps:
      - id: download
        name: Download bounded plan
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: odinn-maintainer-plan-${{ github.run_id }}-${{ inputs.target_kind }}-${{ inputs.target_number }}
          path: ${{ runner.temp }}/odinn-maintainer-plan
      - id: maintainer
        if: steps.download.outcome == 'success'
        uses: BlueDot-IT/odinn-maintainer/.github/actions/apply@e2e078dc86b124e2e0b912cf32c0de0945155d57 # v0.5.0
        with:
          github-token: ${{ github.token }}
          plan-path: ${{ runner.temp }}/odinn-maintainer-plan/plan.json
          allow-automation: ${{ inputs.allow_automation }}
          allow-labels: ${{ inputs.allow_labels }}
          allow-close: ${{ inputs.allow_close }}
          allow-merge: ${{ inputs.allow_merge }}
          allow-repair: ${{ inputs.allow_repair }}
      - name: Publish reconciliation dashboard
        if: always()
        shell: bash
        env:
          TARGET_KIND: ${{ inputs.target_kind }}
          TARGET_NUMBER: ${{ inputs.target_number }}
          DECISION: ${{ steps.maintainer.outputs.decision }}
          CONFIDENCE: ${{ steps.maintainer.outputs.confidence }}
          ACTION: ${{ steps.maintainer.outputs.action }}
          STALE: ${{ steps.maintainer.outputs.stale }}
        run: |
          {
            echo "## Odinn Maintainer reconciliation"
            echo
            echo "- Target: ${TARGET_KIND} #${TARGET_NUMBER}"
            echo "- Decision: ${DECISION:-unavailable}"
            echo "- Confidence: ${CONFIDENCE:-unavailable}"
            echo "- Guarded action: ${ACTION:-none}"
            echo "- Stale plan blocked: ${STALE:-false}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report an unrecoverable queue item
        if: steps.download.outcome != 'success'
        shell: bash
        run: |
          echo "::error::No valid plan artifact was produced for this target; a later event or scheduled sweep will retry it."
          exit 1

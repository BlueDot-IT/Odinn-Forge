version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 1
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        # Runtime/toolchain dependencies need dedicated compatibility and
        # packaged-artifact evidence even for direct minor or patch updates.
        # Separating Node typings also prevents permissive transitive ranges
        # from refreshing to Node 26 inside an otherwise Node 24 update.
        exclude-patterns: ["@types/node", "playwright-core"]
        update-types: ["minor", "patch"]
    ignore:
      # Odinn 1.1 targets the Node 24 / TypeScript 5.9 toolchain. These majors
      # require explicit migration branches and must not enter RC maintenance
      # through a routine dependency group.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/New_York
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
        # The reusable remediation workflow executes with write authority and
        # receives an OAuth secret. Its pinned commit must be reviewed as a
        # dedicated control-plane change, not hidden inside routine actions.
        exclude-patterns:
          - "BlueDot-IT/odinn-maintainer/.github/workflows/codex-security-remediation.yml"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: build
      include: scope
